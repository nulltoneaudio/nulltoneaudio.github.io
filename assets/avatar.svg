<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="NULLTONE avatar">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#14181a"/>
      <stop offset="100%" stop-color="#08090a"/>
    </radialGradient>
    <clipPath id="ring">
      <circle cx="500" cy="500" r="292"/>
    </clipPath>
  </defs>

  <rect width="1000" height="1000" fill="#08090A"/>
  <rect width="1000" height="1000" fill="url(#bg)"/>

  <!-- ring: the null -->
  <circle cx="500" cy="500" r="292" fill="none" stroke="#D8FF3E" stroke-width="34"/>

  <!-- signal: the tone, clipped to the ring -->
  <g clip-path="url(#ring)">
    <path d="M150 500 H 322 L 360 402 L 404 604 L 446 452 L 486 548 L 522 500 H 850"
          fill="none" stroke="#EDE9E3" stroke-width="22" stroke-linecap="square" stroke-linejoin="miter"/>
  </g>

  <!-- corner ticks -->
  <g fill="#8E8E86">
    <rect x="180" y="176" width="26" height="4"/>
    <rect x="794" y="176" width="26" height="4"/>
    <rect x="180" y="820" width="26" height="4"/>
    <rect x="794" y="820" width="26" height="4"/>
  </g>
</svg>
